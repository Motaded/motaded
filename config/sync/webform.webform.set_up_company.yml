id: set_up_company
title: 'Set-Up Company'
description: '<p>This is set-up company form.</p>'
categories: {  }
elements: |-
  company_name:
    '#type': textfield
    '#title': 'Company Name'
    '#placeholder': 'Company Name'
    '#required': true
    '#required_error': 'Company name is required'
  is_the_company_multinational:
    '#type': radios
    '#title': 'Is the company multinational'
    '#options': yes_no
    '#options_display': side_by_side
  do_you_have_a_commercial_register_for_one_year_or_more:
    '#type': radios
    '#title': 'Do you have a commercial register for one year or more?'
    '#options': yes_no
    '#options_display': side_by_side
    '#required': true
    '#required_error': 'The field is required'
  do_you_have_financial_statements_for_the_past_year:
    '#type': radios
    '#title': 'Do you have financial statements for the past year?'
    '#options': yes_no
    '#options_display': side_by_side
    '#required': true
    '#required_error': 'The field is required.'
  do_you_have_an_articles_of_association:
    '#type': radios
    '#title': 'Do you have an Articles of Association'
    '#options': yes_no
    '#options_display': side_by_side
    '#required': true
    '#required_error': 'The field is required.'
  company_registration_number:
    '#type': textfield
    '#title': 'Company Registration Number'
    '#placeholder': 'Company Registration Number'
  country_of_registration:
    '#type': select
    '#title': 'Country of Registration'
    '#options': country_names
    '#required': true
    '#required_error': 'Please select country'
  country:
    '#type': select
    '#title': Country
    '#options': country_names
    '#required': true
    '#required_error': 'Please select country'
  email:
    '#type': email
    '#title': Email
    '#placeholder': Email
    '#required': true
    '#required_error': 'The email field is required'
  website:
    '#type': textfield
    '#title': Website
    '#placeholder': Website
    '#required': true
    '#required_error': 'The field is required'
  country_code:
    '#type': select
    '#title': 'Country Code'
    '#options': country_codes
    '#options_display': one_column
    '#required': true
    '#required_error': 'Please select country code'
    '#format': raw
  mobile_number_without_country_code:
    '#type': tel
    '#title': 'Mobile Number without Country Code'
    '#placeholder': 'Mobile Number'
    '#required': true
    '#required_error': 'The mobile number field is required.'
  commercial_activities:
    '#type': textfield
    '#title': 'Commercial Activities'
    '#required': true
    '#required_error': 'The field is required'
  customer_message:
    '#type': textarea
    '#title': 'Customer Message'
    '#minlength': 25
    '#placeholder': 'Customer Message'
    '#required': true
    '#required_error': 'The field is required'
  are_you_sure_about_the_entered_data:
    '#type': checkbox
    '#title': 'Are you sure about the entered data'
    '#required': true
    '#required_error': 'Please check (Are you sure about the entered data)'
  i_confirm_that_i_have_read_and_agree_to_the_terms_and_conditions:
    '#type': checkbox
    '#title': 'I confirm that I have read and agree to the terms and conditions'
    '#required': true
    '#required_error': 'Please confirm(I confirm that I have read and agree to the terms and conditions)'
