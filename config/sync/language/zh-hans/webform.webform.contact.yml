    '#title': 电话号码
  subject:
    '#title': 主题
    '#placeholder': 输入您的主题
    '#test': '联系网络表格来自 [site:name]'
  category:
    '#title': 类别
    '#options':
      suggestion: 建议
      general: 一般查询
      support: 支持
      complaint: 抱怨
  message:
    '#title': 信息
    '#test': 请忽略这封电子邮件。
  actions:
    '#submit__label': 发送消息
settings:
  confirmation_message: '<p>您的信息已被送出。</p>'
  confirmation_title: '谢谢——Motaded 已收到您的消息。'
handlers:
  email_confirmation:
    label: 电子邮件确认
    settings:
      body: '[webform_submission:values:message:value]'
  email_notification:
    label: 电子邮件通知
    settings: {  }
