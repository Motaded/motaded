title: 联络表
elements: |
  name:
    '#title': 你的名字
    '#placeholder': 输入您的名字
  last_name:
    '#title': 姓
    '#placeholder': 输入您的姓氏
  email:
    '#title': 您的电子邮件
    '#placeholder': 输入您的电子邮件
