settings:
  confirmation_title: 'Gracias — Motaded recibió tu mensaje.'
  confirmation_message: '<p>Su mensaje ha sido enviado.</p>'
  confirmation_url: /contact-us/success
title: Contacto
description: '<p>Basic email contact webform.</p>'
elements: |
  name:
    '#title': 'Su nombre'
    '#placeholder': 'Escribe tu nombre'
  last_name:
    '#title': Apellido
    '#placeholder': 'Escribe tu apellido'
  email:
    '#title': 'Tu correo electrónico'
    '#placeholder': 'Escribe tu correo electrónico'
    '#pattern_error': 'Por favor, introduce tu dirección de correo electrónico oficial. Si no tienes una, <a href="/contact-us">haga clic aquí</a>'
  ph_number:
    '#title': 'Número de teléfono'
  subject:
    '#title': Sujeta
    '#placeholder': 'Escribe tu tema'
    '#test': 'formulario web de contacto desde [site:name]'
  category:
    '#title': Categoría
    '#options':
      suggestion: Sugerencia
      general: 'Consulta general'
      support: Apoyo
      complaint: Queja
  message:
    '#title': Mensaje
    '#test': 'Por favor ignore este correo electrónico.'
  actions:
    '#submit__label': 'enviar mensaje'
handlers:
  email_confirmation:
    label: 'Confirmación por correo electrónico'
    settings:
      body: '[webform_submission:values:message:value]'
  email_notification:
    label: 'Aviso por correo electrónico'
    settings:
      body: '[webform_submission:values:message:value]'
