label: 'استمارة الاتصال الشخصية'
message: '<p class="mt-2 text-gray-700">تم تسجيل طلبك في نظامنا، وتم إرسال رسالة تأكيد إلى بريدك الإلكتروني. سيقوم مستشارونا بمراجعة التفاصيل والعودة إليك بأفضل خطوة تالية تناسب احتياجاتك.</p><div class="mt-3 text-sm text-gray-600 flex flex-wrap items-center gap-3"><span>المرجع:</span> <code class="rounded bg-gray-100 px-2 py-1 text-gray-800">REQ-[current-date:html_year]-[webform_submission:sid]</code> <span class="hidden md:inline" aria-hidden="true">•</span> <span>تم الإرسال في [current-date:custom:d M Y, H:i] (السعودية)&nbsp;</span></div>'
