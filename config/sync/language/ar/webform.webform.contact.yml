title: 'اتصل بنا'
description: '<p>Basic email contact webform.</p>'
elements: |
  name:
    '#title': اسمك
    '#placeholder': 'اكتب اسمك الأول'
  last_name:
    '#title': 'اسم العائلة'
    '#placeholder': 'اكتب اسمك الأخير'
  email:
    '#title': 'البريد الإلكتروني الخاص بك'
    '#placeholder': 'اكتب بريدك الإلكتروني'
  ph_number:
    '#title': 'رقم التليفون'
  subject:
    '#title': موضوع
    '#placeholder': 'اكتب الموضوع الخاص بك'
    '#test': 'اختبار نموذج ويب الاتصال من [site:name]'
  category:
    '#title': فئة
    '#options':
      suggestion: اقتراح
      general: 'استفسار عام'
      support: يدعم
      complaint: شكوى
  message:
    '#title': رسالة
    '#test': 'يرجى تجاهل هذا البريد الإلكتروني.'
  actions:
    '#submit__label': 'أرسل رسالة'
settings:
  confirmation_message: '<p class="mt-2 text-gray-700">تم تسجيل طلبك في نظامنا، وتم إرسال رسالة تأكيد إلى بريدك الإلكتروني. سيقوم مستشارونا بمراجعة التفاصيل والعودة إليك بأفضل خطوة تالية تناسب احتياجاتك.</p><div class="mt-3 text-sm text-gray-600 flex flex-wrap items-center gap-3"><span>المرجع:</span> <code class="rounded bg-gray-100 px-2 py-1 text-gray-800">REQ-[current-date:html_year]-[webform_submission:sid]</code> <span class="hidden md:inline" aria-hidden="true">•</span> <span>تم الإرسال في [current-date:custom:d M Y, H:i] (السعودية)&nbsp;</span></div>'
  confirmation_url: /contact-us/success
handlers:
  email_confirmation:
    label: 'تأكيد البريد الإلكتروني'
    settings:
      body: '[webform_submission:values:message:value]'
  email_notification:
    label: 'إشعارات البريد'
    settings:
      body: '[webform_submission:values:message:value]'
