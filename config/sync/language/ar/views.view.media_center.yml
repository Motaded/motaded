            value: '<p>مرحبًا بك في المركز الإعلامي لـ متجدد، مصدرك الشامل للحصول على آخر الأخبار والتحديثات والرؤى حول فرص الأعمال وترخيص المقر الإقليمي (RHQ) في المملكة العربية السعودية. ستجد هنا جميع المعلومات التي تحتاجها للبقاء على اطلاع حول مبادراتنا وفعالياتنا ومشهد الأعمال في المملكة العربية السعودية ومنطقة الشرق الأوسط وشمال أفريقيا على نطاق أوسع.</p>'
