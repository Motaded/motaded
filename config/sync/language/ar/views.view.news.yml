            title: 'أحدث الأخبار | معتد'
            description: 'آخر الأخبار. رؤى وتحليلات معمّقة للمستثمرين ورواد الأعمال والشركات التي تبني أعمالها في السعودية.'
      exposed_form:
        options:
          submit_button: تطبيق
          reset_button_label: مسح
      filters:
