display:
  default:
    display_options:
      fields:
        view_node:
          text: 'اقرأ المزيد'
  page_1:
    display_options:
      empty:
        area:
          content:
            value: |
              <div
                  class="mt-10 flex flex-col items-center justify-center gap-3 rounded-xl border border-dashed border-gray-300 bg-white px-6 py-12 text-center"
                  role="status"
              >
                  <h2 class="text-xl font-semibold text-gray-900 m-0">
                  لم يُعثر على مقالات
                  </h2>
                  <p class="text-sm text-gray-600 m-0" x-data="{q : '[current-page:query:search]'}">
                  <span>لا توجد نتائج</span>
                  <template x-if="q">
                      <span>
                      لـ
                      <span class="font-medium text-primary-700" x-text="'«' + q + '»'"></span>
                      </span>
                  </template>
                  <span> المطابقة للمرشّحات.</span>
                  </p>
                  <p class="text-xs text-gray-500 m-0">
                  جرّب تعديل عبارة البحث أو إلغاء التصفية للعثور على المزيد من المقالات.
                  </p>
              </div>
            format: full_html
      title: 'رؤى ومقالات لممارسة الأعمال في المملكة العربية السعودية'
      display_extenders:
        metatag_display_extender:
          metatags:
            title: 'رؤى ومقالات لممارسة الأعمال في المملكة العربية السعودية | متعدد'
            description: 'أدلة عملية وتحليلات للسوق وشروحات تفصيلية تغطّي تأسيس الشركات والمنصات الحكومية والأنظمة والقطاعات المحفّزة للنمو في المملكة العربية السعودية.'
            canonical_url: '[site:base-url]/ar/blog'
            hreflang_xdefault: '[site:base-url]/blog'
            'hreflang_per_language:hreflang_en': '[site:base-url]/blog'
            'hreflang_per_language:hreflang_ar': '[site:base-url]/ar/blog'
      exposed_form:
        options:
          submit_button: تطبيق
          reset_button_label: مسح
          exposed_sorts_label: 'الترتيب حسب'
      filters:
        combine:
          expose:
            placeholder: 'ابحث في المقالات، المواضيع أو الكلمات المفتاحية…'
    display_title: 'أحدث المقالات'
