            value: '<div class="entitieBlock"><div class="contentG"><h1 class="titleHead">Entités de l''entreprise</h1><p>Créer une entreprise en Arabie Saoudite commence par la sélection de la bonne structure d''entreprise. Cette décision a un impact significatif sur votre exposition aux risques, votre potentiel de croissance et votre conformité aux lois locales. Comprendre les différents types d''entités d''entreprise disponibles peut vous aider à faire un choix éclairé qui correspond à vos objectifs commerciaux. Voici un aperçu des principales entités de l’entreprise en Arabie Saoudite pour guider le parcours de création de votre entreprise en Arabie Saoudite.</p><p><a class="darkBtn" href="#">Voir tout<svg width="12" height="10" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.793 4.49965H0.5C0.367392 4.49965 0.240215 4.55233 0.146447 4.6461C0.0526785 4.73987 0 4.86705 0 4.99965C0 5.13226 0.0526785 5.25944 0.146447 5.35321C0.240215 5.44698 0.367392 5.49965 0.5 5.49965H9.793L6.146 9.14565C6.05211 9.23954 5.99937 9.36688 5.99937 9.49965C5.99937 9.63243 6.05211 9.75977 6.146 9.85365C6.23989 9.94754 6.36722 10.0003 6.5 10.0003C6.63278 10.0003 6.76011 9.94754 6.854 9.85365L11.354 5.35365C11.4006 5.30721 11.4375 5.25203 11.4627 5.19129C11.4879 5.13054 11.5009 5.06542 11.5009 4.99965C11.5009 4.93389 11.4879 4.86877 11.4627 4.80802C11.4375 4.74728 11.4006 4.6921 11.354 4.64565L6.854 0.145655C6.76011 0.0517683 6.63278 -0.000976562 6.5 -0.000976562C6.36722 -0.000976562 6.23989 0.0517683 6.146 0.145655C6.05211 0.239542 5.99937 0.366879 5.99937 0.499655C5.99937 0.632431 6.05211 0.759768 6.146 0.853655L9.793 4.49965Z" fill="currentcolor"></path></svg></a></p></div><div class="squares2"><img src="/themes/custom/motaded/images/2squres.svg" alt="" width="400" height="400"></div></div>'
