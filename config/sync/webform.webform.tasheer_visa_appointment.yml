id: tasheer_visa_appointment
title: 'Tasheer visa'
description: '<p>Step 1: nationality, appointment preview, first consent. Step 2: Terms. Step 3: visa type / entries / validity, application type (Individual/Family), second consent, email. Lists: <em>Webform options</em> (tasheer_*).</p>'
categories: {  }
elements: |-
  application:
    '#type': webform_wizard_page
    '#title': 'Application & consent'
    '#next_button_label': Continue
    select_nationality:
      '#type': select
      '#title': 'Select Nationality'
      '#required': true
      '#options': tasheer_nationality
      '#empty_option': '- Select -'
    tasheer_appointment_details:
      '#type': processed_text
      '#title': 'Appointment availability & disclaimer'
      '#states':
        visible:
          ':input[name="elements[application][select_nationality]"]':
            filled: true
      '#text': |
        <div class="tasheer-appointment-details">
          <div class="tasheer-appointment-details__table-wrap">
            <table class="tasheer-appointment-details__table" cellpadding="0" cellspacing="0" role="presentation">
              <thead>
                <tr>
                  <th>City</th>
                  <th>Center</th>
                  <th>Normal</th>
                  <th>Lounge</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Rome</td>
                  <td>Rome</td>
                  <td>31 Mar</td>
                  <td></td>
                </tr>
                <tr>
                  <td>Milan</td>
                  <td>Milan</td>
                  <td>31 Mar</td>
                  <td>31 Mar</td>
                </tr>
              </tbody>
            </table>
          </div>
  
          <p class="tasheer-appointment-details__note">* The dates indicated above are based on the earliest available time slot under each appointment category (Normal and Lounge), and is subject to availability at the time of booking the appointment.</p>
          <p class="tasheer-appointment-details__note">* Please click on the &lsquo;Continue&rsquo; button at the end of this page to see additional appointment date options, and to book your appointment.</p>
  
          <h3 class="tasheer-appointment-details__disclaimer-title">Disclaimer :</h3>
          <div class="tasheer-appointment-details__disclaimer">
            <p>Tasheer does hereby declare that they have no role whatsoever in the assessment or decision making of a visa application, which is the sole prerogative of the Royal Embassies and Consulates of the Kingdom of Saudi Arabia.</p>
            <p>Therefore, Tasheer will not in any manner be liable or responsible for any delay in the processing or rejection of any visa applications, once the documents have been delivered to the respective Embassy/ Consulate. Tasheer will take every precaution in handling passports and documents submitted by applicants.</p>
            <p>The duration of visa (number of days) and the number of entries (Single or Multiple entries) is granted solely at the discretion of the Royal Embassies/ Consulates of the Kingdom of Saudi Arabia.</p>
            <p>Visa Fees, Visa PlatformIT Fees and, if applicable based on the visa category, Insurance fee, Insurance Service Fee and Medical Fees are collected on behalf of the Ministry of Foreign Affairs (MoFA), Kingdom of Saudi Arabia.</p>
            <p>A Service fee is levied on each visa application submitted at the Tasheer Visa Service Centre. This is a non- refundable fee and will be levied even on applicants who are exempted from paying the Visa related fees.</p>
            <p>All other services (other than the visa related fees and service fee described above) acquired by an applicant are optional, none of which are mandatory to obtain a visa to the Kingdom of Saudi Arabia.</p>
            <p>The processing time for the visa application at the Embassy/ Consulate has no relationship with your choice of the appointment category (Normal or Lounge).</p>
            <p>All fees are subject to change as per exchange rate and the communication received by Tasheer from the Ministry of Foreign Affairs, Kingdom of Saudi Arabia. If there is a change in fees on the date of the appointment, the current (updated) fees will be collected at the center.</p>
            <p>The above visa fees does not apply for American Nationals applying under a visit visa category.</p>
            <p>If the applicant mentions any fee as already paid, the respective proof of payment will have to be presented at the time of appointment in the center.</p>
            <p>Pursuant to a communication from the Ministry of Foreign Affairs of the Kingdom of Saudi Arabia, it is now mandatory for visa applicants, applying for travel to the Kingdom of Saudi Arabia for the purpose of visit, extension or transit as well as their companions, to obtain a valid insurance certificate from insurance companies accredited by the Ministry of Foreign Affairs, Kingdom of Saudi Arabia (MoFA). The said insurance policy will cover medical conditions, emergencies (ambulatory) and medical evacuation within Kingdom of Saudi Arabia and will be brought through Visa Platform(MoFA Portal) and payment made to MoFA account through E-wallet.</p>
            <p>The insurance requirement shall apply to all visitor visa categories (except Hajj, Umrah, Work, Resident, Student, Diplomatic, Mission and Organization, and Government visit), irrespective of whether the applicant has prior insurance coverage.</p>
            <p>The money against the insurance policy is being collected with Visa Platform Fees, as a part of the visa issuance process for the kingdom of Saudi Arabia in accordance with the direction of the Ministry of Foreign Affairs, Kingdom of Saudi Arabia (MoFA). Tasheer is only facilitating the visa application process and is not associated directly or indirectly with the insurance companies and has no role whatsoever in the distribution and/or intermediation of insurance, which is the sole prerogative of MoFA and is being managed by MoFA directly.</p>
            <p>Tasheer shall not be considered as an Insurance agent, broker, ancillary, tied/non-tied insurance intermediary, or any other insurance intermediary.</p>
          </div>
        </div>
      '#format': full_html
    tasheer_consent_notice:
      '#type': processed_text
      '#title': Consent
      '#states':
        visible:
          ':input[name="elements[application][select_nationality]"]':
            filled: true
      '#text': |
        <p><strong>Consent</strong></p>
        <p>By clicking here, I Indicate that I consent to Tasheer processing my personal data, which Includes sensitive data such as religion for the purposes of processing my visa application for KSA. I also consent for my personal data to be transferred offshore, as mentioned in the <a href="/privacy-policy">Privacy Policy</a> V1.2.</p>
      '#format': full_html
    tasheer_consent:
      '#type': checkbox
      '#title': 'I confirm the consent declarations above.'
      '#required': true
      '#states':
        visible:
          ':input[name="elements[application][select_nationality]"]':
            filled: true
  terms_and_conditions:
    '#type': webform_wizard_page
    '#title': 'Terms and Conditions'
    '#prev_button_label': DECLINE
    tasheer_terms_of_use:
      '#type': processed_text
      '#title': 'Terms of Use'
      '#text': |
        <div class="tasheer-terms-scroll tasheer-terms-of-use">
          <h3>Terms of Use</h3>
          <h4>Introduction</h4>
          <p>Welcome to the website of Tasheer JLT (hereinafter referred to as 'Tasheer'). Visa applicants and users are urged to read the user Terms and Conditions before using this website (the 'website'). The use of this website and services provided by Tasheer are subject to acceptance of the same by the visa applicant/user. If you do not accept these terms and conditions, do not continue to use or access this website. By accessing or using the website, you signify your agreement to be bound by the user Terms and Conditions.</p>
          <p>Tasheer provides logistic and visa process facilitation services to visa applicants/users applying for a Visa.</p>
        
          <h4>Reschedule Appointment</h4>
          <ul>
            <li>You can reschedule an appointment only up to the day prior to the appointment date, post which this option will be restricted.</li>
            <li>If you have an appointment within the next 3 days and you wish to reschedule the appointment, you will not be able to book a normal appointment for the next 7 days. You can book a Premium Lounge appointment only.</li>
          </ul>
        
          <h4>Appointment cancellation</h4>
          <ul>
            <li>You can cancel an appointment only up to the day prior to the appointment date, post which this option will be restricted.</li>
            <li>If you have an appointment within the next 3 days and you wish to cancel the appointment, you will not be able to book a normal appointment for the next 7 days. You can book a Premium Lounge appointment only.</li>
          </ul>
        
          <h4>No Show for a previous appointment</h4>
          <p>If you had an appointment previously but did not visit the Visa Service centre or did not submit your application at the Visa Services Center on the appointment date due to any reason, you will not be able to book a new Normal appointment for the next 7 days. You can book a new Premium Lounge appointment only.</p>
        
          <h4>Number of changes in an appointment</h4>
          <p>If you have rescheduled and/ or cancelled your appointment more than 5 times, you will not be able to book a new Normal appointment for the next 14 days. You can book a new Premium Lounge appointment only.</p>
        
          <h3>User Terms and Conditions</h3>
          <h4>Scope of User Terms &amp; Conditions</h4>
          <p>By accepting the User Terms &amp; Conditions Agreement, you agree that your use of Tasheer Website and websites related and linked to Tasheer website, all applications, software and services available on the Website (except to the extent such services are subject of a separate agreement) will be governed by the User Terms &amp; Conditions posted on that Website/s with such changes and modifications as may be made from time to time.</p>
        
          <h4>Eligibility of User</h4>
          <p>The Website is available only to persons over the age of legal majority who can form legally binding agreement(s) under applicable law. Do not use the website if you cannot or are barred from entering into legally binding contracts or you are under the age of 18 or are temporarily or indefinitely suspended or prohibited from or accessing or using this or the linked websites as may be applicable.</p>
        
          <h4>Intellectual Property Rights</h4>
          <p>Tasheer owns or is licensed to use all intellectual property rights associated with the Website and its contents including the logos, graphics, icons, etc. ('Intellectual Property'). The Intellectual Properties are protected under the applicable laws and may not be copied or imitated or used or reproduced, in whole or in part, without the express written consent of Tasheer. Tasheer grants you a limited, personal, non transferable and revocable license to access and use the Website and the services only in the manner permitted by Tasheer. Apart from such limited license no other right or interest is granted by Tasheer in the Website or its contents or services which shall always remain the property of Tasheer, its affiliates or third parties.</p>
        
          <h4>Prohibition against unlawful use</h4>
          <p>While accessing or using website, the user shall not:</p>
          <ul>
            <li>Post any content or items in an inappropriate category or areas on the Website nor post any material in whatsoever form, on the Website for any purpose other than the normal purpose for which the website is intended;</li>
            <li>Violate any laws, third party right, or policies of Tasheer;</li>
            <li>Hide or spoof his/her IP address or intentionally or bounce his/her communications through any intermediate computers;</li>
            <li>Alter the logs upon gaining access;</li>
            <li>Interfere with the technological operations of the Website or attempt or manipulate the content or material on the Website or of any other user or users;</li>
            <li>Post false, inaccurate, misleading, defamatory, or libellous content including personal information;</li>
            <li>Use any robot, spider, search engine, scraper or other means whether manual, automated, mechanical, electrical or electronics either existing or that may be invented or discovered to access the Website and/or to do any of the acts mentioned above for any purpose other than the normal purpose for which the website is intended;</li>
          </ul>
          <p>Additionally, user agrees not to:</p>
          <ul>
            <li>Take any action that imposes or may impose (in our sole discretion) an unreasonable or disproportionately large load on Tasheer's infrastructure;</li>
            <li>Interfere or attempt to interfere with the proper working of the Website or any activities conducted on the Website;</li>
            <li>Bypass our robot exclusion headers or other measures we may use to prevent or restrict access to the Website;</li>
            <li>Do or take any action that may undermine the feedback or ratings systems, such as displaying, importing or exporting feedback information of the Website or for using it for the purposes unrelated to Tasheer;</li>
            <li>Access or attempt to gain root access, use any manual, mechanical, electrical or electronic means, computer programs, exploits, hacker tools, or scripts, software or hardware tools, search engines either existing or that may be invented either directly, indirectly or through any contrivance to change, modify, post, violate, misuse, abuse, erase, hack, distort, slow down, configure any system, website, to work for them, or to cause denial of services to other users or on other computers or down the website or its user features;</li>
            <li>Send, post, plant or distribute viruses or any other technologies that may harm Tasheer, or the interests or property of users;</li>
            <li>Copy, modify, or distribute content from the website and/or Tasheer's copyrights and trademarks or other intellectual property;</li>
            <li>Harvest or otherwise collect information about other users, their details, or any information relating to any other user's passport details, email addresses, etc.</li>
          </ul>
          <p>In case of any unlawful, illegal or prohibited use, the user shall be liable for action under applicable laws including any claim for damages.</p>
        
          <h4>Limitation of Use/Termination</h4>
          <p>Without limiting other remedies, Tasheer may at its sole discretion or at the advice or under the directions of its clients limit, suspend, terminate temporarily or permanently, disable or prevent a user from accessing/making use of its service, prohibit access to its website/s, remove hosted content, and take technical and legal steps to keep user/s off the website if Tasheer thinks that the user is or is attempting to resort to abnormal usage or abuse, creating problems, potential or otherwise or possible legal liabilities, or is not acting consistently with the normal usage. The access and/or use of the website are at the discretion of Tasheer and use by anyone may be restricted or terminated by Tasheer at any time.</p>
        
          <h4>Links to other websites</h4>
          <p>At various points throughout the Website you may be offered automatic links to other internet websites including User/Mission websites that may be relevant to a particular aspect of this Website. This does not indicate that Tasheer is necessarily associated with any of these other websites. Whilst it is the intention of Tasheer that you should find these other websites of interest, neither Tasheer, nor their officers, employees and agents shall have any responsibility or liability of any nature whatsoever for these other websites or any information contained in them, none of which have been verified or endorsed by Tasheer or its affiliates.</p>
        
          <h4>No Warranty &amp; Limitation of Liability</h4>
          <p>THE WEBSITE AND THE CONTENTS AND SERVICES AVAILABLE IN THE WEBSITE ARE MADE AVAILABLE STRICTLY ON AN 'AS IS' AND 'AS AVAILABLE' BASIS. Tasheer MAKES NO REPRESENTATIONS OR WARRANTY ABOUT THE COMPLETENESS, ACCURACY, RELIABILITY, SUITABILITY OR AVAILAIBITY WITH RESPECT TO THE WEBSITE OR ITS CONTENTS OR SERVICES PROVIDED THROUGH IT OR THE RESULTS TO BE OBTAINED FROM USING THE WEBSITE, OR THE CONTENTS OR SERVICES MADE AVAILABLE AT THE WEBSITE. WHERE YOU RELY ON ANY INFORMATION OR OTHER MATERIAL CONTAINED IN IT, YOU DO SO ENTIRELY AT YOUR OWN RISK AND YOU ACCEPT THAT ALL WARRANTIES, CONDITIONS AND UNDERTAKINGS, EXPRESS OR IMPLIED, WHETHER UNDER APPLICABLE LAW, TRADE USAGE, COURSE OF DEALINGS OR OTHERWISE IN RESPECT OF THE WEBSITE ARE EXCLUDED TO THE FULLEST EXTENT PERMITTED BY LAW. In no event will Tasheer be liable for damages of any kind, including without limitation, direct or indirect, incidental or consequential damages (including, but not limited to, damages for lost profits, business interruption and loss of programs or information) arising out of the use of or inability to use Tasheer's Website, or any information provided on the Website or for any acts of the authorized agents who may be performing some of the functions such as scheduling of interview of the Visa applicants by using the Website or any other website or content accessed through it.</p>
        
          <h4>Indemnity</h4>
          <p>The user agrees to indemnify and hold Tasheer, its officers, directors, agents, subsidiaries, joint venture partners and employees, harmless from any claim or demand, including reasonable attorneys fees, made by any third party due to or arising out of the breach of this User Terms &amp; Conditions, or violation by the user of any law of any country or the rights of a third party.</p>
        
          <h4>Injunctive Relief</h4>
          <p>The user acknowledges that a violation or any attempt thereof for any of the User Terms &amp; Conditions shall cause irreparable damage to Tasheer, the exact amount of which would be difficult to ascertain and for which there will be no adequate remedy at law. The User agrees that Tasheer shall be entitled to obtain an injunctive relief issued by any court of competent jurisdiction, restraining the violation or any attempt thereof of the terms and conditions by user, or its affiliates, partners, or agents. Tasheer shall be entitled to recover from user all costs and expenses incurred by Tasheer in obtaining the injunction, including attorney's fees.</p>
        
          <h4>Modification of the User Terms &amp; Conditions</h4>
          <p>Tasheer reserves the right to amend or modify these User Terms &amp; Conditions at any time. You hereby accept to be bound by such modifications made by Tasheer to the User Terms &amp; Conditions. Any aspect of the Website may be changed, supplemented, deleted or updated without notice at the sole discretion of Tasheer.</p>
        
          <h4>Notice</h4>
          <p>Except as explicitly stated otherwise, legal notices shall be served on Tasheer's authorised agent at: [.] and to the Visa applicant/user at: the e-mail address and/or address provided to Tasheer during the online registration process. Notice is deemed given 24 hours after an e-mail is sent. Tasheer may issue legal notice by e-mail or to the address provided during the online registration process.</p>
        
          <h4>Governing Law &amp; Jurisdiction</h4>
          <p>These User Terms &amp; Conditions shall be governed in all respects by the laws of the United Arab Emirates (UAE) as they apply to agreements entered into and to be performed entirely within UAE between its residents, without regard to conflicts of law provisions. The user agrees that any claim or dispute he/she may have against Tasheer including but not limited to those that may arise from the use of this Website or services provided by Tasheer must be resolved by a court of competent jurisdiction located in Dubai to the exclusion of all other courts. Tasheer is located at [.]. If the user resides outside Dubai and accesses the website, the services are offered by Tasheer subject to the user's acceptance of the jurisdictional terms and conditions. If any provision of this Agreement is held to be invalid or unenforceable, such provision shall be severed and the remaining provisions shall be enforced.</p>
        
          <h4>General</h4>
          <ul>
            <li>Headings are for reference purposes only and do not limit the scope or extent of such section.</li>
            <li>Tasheer's failure to act with respect to a breach by a user or users or others does not waive its rights to act with respect to any breach, subsequent or similar breaches. Tasheer reserves the right to take action as it may decide, or advised and or as directed by its clients.</li>
            <li>Tasheer may assign this Agreement in its sole discretion.</li>
            <li>Tasheer may at any time amend this Agreement/part thereof by posting the amended terms and conditions on the website. Except as stated elsewhere, all amended terms shall automatically be effective as at the time of accessing the website and using the services.</li>
            <li>This Agreement sets forth the entire understanding and agreement between the user with Tasheer with respect to the subject matter hereof.</li>
          </ul>
        
          <h4>Disclaimer</h4>
          <p>Any promotional offer/advertisement released by the respective service providers of their travel related services does not amount to endorsement of the products and services by the Government of Saudi Arabia or its partner Tasheer.</p>
        </div>
