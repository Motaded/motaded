id: book_a_free_consultation
title: 'Book A Free Consultation'
description: ''
categories: {  }
elements: |-
  flexbox:
    '#type': webform_flexbox
    first_name:
      '#type': textfield
      '#title': 'First Name'
      '#placeholder': 'First Name'
      '#required': true
    last_name:
      '#type': textfield
      '#title': 'Last Name'
      '#placeholder': 'Last Name'
      '#required': true
  flexbox_01:
    '#type': webform_flexbox
    contact_number:
      '#type': tel
      '#title': 'Phone Number'
      '#required': true
      '#default_value': '+966 '
      '#international': true
      '#international_initial_country': SA
      '#international_preferred_countries':
        - SA
    email:
      '#type': email
      '#title': Email
      '#placeholder': Email
      '#required': true
      '#pattern': '^[a-zA-Z0-9._%+-]+@(?!.*(example\.com|gmail\.com|yahoo\.com|rambler\.ru|mail\.ru|outlook\.com|hotmail\.com|aol\.com|protonmail\.com|icloud\.com|mail2world\.com|tutanota\.com|juno\.com|atmail\.com|fastmail\.com|gmxmail\.com|hushmail\.com|lycos\.com|mail\.com|yandex\.com|2mailcache\.com|3way3\.com|bk\.ru|1mailcache\.com|web\.de|bizopphand\.info|unlockrevenue\.info))([a-zA-Z0-9.-]+\.[a-zA-Z]{2,})$'
      '#pattern_error': 'Please enter your official email address. If you don''t have one, <a href="/contact-us">click here</a>'
  flexbox_02:
    '#type': webform_flexbox
    organization_name:
      '#type': textfield
      '#title': ' Company Name'
      '#placeholder': ' Company Name'
      '#required': true
    company_registration_number:
      '#type': textfield
      '#title': 'Company Registration Number'
      '#placeholder': 'Company Registration Number'
  is_the_company_multinational:
    '#type': radios
    '#title': 'Is the Company Multinational? '
    '#options': yes_no
    '#options_display': side_by_side
    '#required': true
    '#required_error': 'The field is required.'
  do_you_have_a_commercial_register_for_one_year_or_more:
    '#type': radios
    '#title': 'Do You Have a Commercial Register for One Year or More?'
    '#options': yes_no
    '#options_display': side_by_side
    '#required': true
    '#required_error': 'The field is required.'
  nocommercial:
    '#type': processed_text
    '#states':
      visible:
        ':input[name="do_you_have_a_commercial_register_for_one_year_or_more"]':
          value: 'No'
    '#text': '<p>If you do not have a commercial registration, please contact us at this email <a href="mailto:info@motaded.com.sa">info@motaded.com.sa</a></p>'
    '#format': basic_html
  do_you_have_financial_statements_for_the_past_year:
    '#type': radios
    '#title': 'Do You Have Financial Statements for the Past Year?'
    '#options': yes_no
    '#options_display': side_by_side
    '#required': true
    '#required_error': 'The field is required.'
  nofinancial:
    '#type': processed_text
    '#states':
      visible:
        ':input[name="do_you_have_financial_statements_for_the_past_year"]':
          value: 'No'
    '#text': '<p>If you do not have a Financial Statement, please contact us at this email <a href="mailto:info@motaded.com.sa">info@motaded.com.sa</a></p>'
    '#format': basic_html
  do_you_have_an_articles_of_association:
    '#type': radios
    '#title': 'Do You Have an Articles of Association?'
    '#options': yes_no
    '#options_display': side_by_side
    '#required': true
    '#required_error': 'The field is required.'
  noarticles:
    '#type': processed_text
    '#states':
      visible:
        ':input[name="do_you_have_an_articles_of_association"]':
          value: 'No'
    '#text': '<p>If you do not have an Articles of Association, please contact us at this email <a href="mailto:info@motaded.com.sa">info@motaded.com.sa</a></p>'
    '#format': basic_html
  1parent_company_s_country:
    '#type': select
    '#title': 'Parent Company’s Country'
    '#options': country_codes
    '#empty_option': Country
    '#default_value': SA
  commercial_activities:
    '#type': textarea
    '#title': 'Commercial Activities'
    '#placeholder': 'Commercial Activities *'
    '#required': true
    '#required_error': 'Commercial Activities field is required.'
  type_your_message:
    '#type': textarea
    '#title': 'Type your message'
    '#placeholder': 'Type your message *'
    '#required': true
    '#required_error': 'Message field is required.'
    '#pattern': '^(?!.*(https?://|www\.)).{0,140}$'
    '#pattern_error': 'Please enter no more than 140 characters and don’t include links.'
  are_you_certain_about_the_data_you_ve_entered:
    '#type': checkbox
    '#title': "Are you certain about the data you've entered?"
    '#required': true
    '#required_error': "Please check (Are you certain about the data you've entered?)"
  i_confirm_that_i_have_read_and_agree_to_the_terms_and_conditions:
    '#type': checkbox
    '#title': 'I confirm that I have read and agree to the terms and conditions.'
    '#required': true
    '#required_error': 'Please check (I confirm that I have read and agree to the terms and conditions.)'
  captcha:
    '#type': captcha
    '#captcha_type': recaptcha/reCAPTCHA
