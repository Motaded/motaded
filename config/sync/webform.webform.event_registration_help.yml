    '#type': select
    '#title': 'I would like to register as'
    '#empty_option': 'Please select'
    '#required': true
    '#options':
      'Trade visitor': 'Trade visitor'
      'Buyer visitor': 'Buyer visitor'
      'Media attendee': 'Media attendee'
      'Student/Tutor': 'Student/Tutor'
      'Public visitor': 'Public visitor'
      'Hosted Buyer': 'Hosted Buyer'
    '#wrapper_attributes':
      class:
        - event-help__field
  nature_of_business:
    '#type': select
    '#title': 'Nature of business'
    '#empty_option': 'Please select'
    '#required': true
    '#options':
      'Government / Tourism Board': 'Government / Tourism Board'
      'Destination Management Organization (DMO)': 'Destination Management Organization (DMO)'
      'Travel Agency / Tour Operator': 'Travel Agency / Tour Operator'
      'Hotel / Accommodation Provider': 'Hotel / Accommodation Provider'
      'Airline / Transportation': 'Airline / Transportation'
      'Cruise Line': 'Cruise Line'
      'Event Planning / MICE (Meetings, Incentives, Conferences, Exhibitions)': 'Event Planning / MICE (Meetings, Incentives, Conferences, Exhibitions)'
      'Tourism Marketing / Advertising Agency': 'Tourism Marketing / Advertising Agency'
      'Technology Solutions Provider': 'Technology Solutions Provider'
      'Hospitality Consultant': 'Hospitality Consultant'
      'Visitor Attraction / Entertainment': 'Visitor Attraction / Entertainment'
      'Travel Insurance Provider': 'Travel Insurance Provider'
      'Food & Beverage / Restaurant': 'Food & Beverage / Restaurant'
      'Educational Institution (Tourism/Hospitality)': 'Educational Institution (Tourism/Hospitality)'
      'Sustainability / Ecotourism Initiatives': 'Sustainability / Ecotourism Initiatives'
      'Media / Publications': 'Media / Publications'
      'Retail / Souvenirs': 'Retail / Souvenirs'
      'Travel Blogger / Influencer': 'Travel Blogger / Influencer'
      'Corporate / Business Travel Services': 'Corporate / Business Travel Services'
      'Wellness / Health Tourism Provider': 'Wellness / Health Tourism Provider'
      Other: Other
    '#wrapper_attributes':
      class:
        - event-help__field
        - event-help__field--span-2
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Request help'
