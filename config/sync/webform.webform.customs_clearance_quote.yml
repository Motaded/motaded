id: customs_clearance_quote
title: 'Clearance assessment'
description: 'Clearance assessment requests from the customs landing page.'
categories: {  }
elements: |-
  flex_contact:
    '#type': webform_flexbox
    first_name:
      '#type': textfield
      '#title': 'First name'
      '#required': true
    last_name:
      '#type': textfield
      '#title': 'Last name'
      '#required': true
  flex_contact_2:
    '#type': webform_flexbox
    email:
      '#type': email
      '#title': Email
      '#required': true
    phone:
      '#type': tel
      '#title': 'Phone number'
      '#required': true
      '#default_value': '+966 '
      '#international': true
      '#international_initial_country': SA
  company_name:
    '#type': textfield
    '#title': 'Company name'
    '#required': true
  flex_shipment:
    '#type': webform_flexbox
    direction:
      '#type': radios
      '#title': 'Trade direction'
      '#required': true
      '#options':
        import: Import
        export: Export
    cargo_type:
      '#type': select
      '#title': 'Cargo category'
      '#required': true
      '#empty_option': '- Select -'
      '#options':
        general: 'General cargo'
        food: 'Food or special foods'
        pharma: 'Pharma or medical devices'
        cosmetics: Cosmetics
        electronics: 'Electronics or consumer goods'
        chemicals: 'Chemicals or restricted goods'
        other: Other
  shipment_details:
    '#type': textarea
    '#title': 'Shipment details'
    '#description': 'What you are shipping, origin or destination, and whether the cargo has already arrived.'
    '#rows': 4
  consent:
    '#type': checkbox
    '#title': 'I agree to be contacted about this assessment request.'
    '#required': true
  captcha:
    '#type': captcha
    '#captcha_type': recaptcha/reCAPTCHA
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Submit
