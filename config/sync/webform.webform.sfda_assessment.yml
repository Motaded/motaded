id: sfda_assessment
title: 'SFDA assessment'
description: 'Assessment requests from the medicine, medical device and cosmetics service landing pages.'
categories: {  }
elements: |-
  full_name:
    '#type': textfield
    '#title': 'Full name'
    '#required': true
  email:
    '#type': email
    '#title': 'Work email'
    '#placeholder': name@company.com
    '#required': true
    '#pattern': '^[a-zA-Z0-9._%+-]+@(?!.*(example\.com|gmail\.com|yahoo\.com|rambler\.ru|mail\.ru|outlook\.com|hotmail\.com|aol\.com|protonmail\.com|icloud\.com|mail2world\.com|tutanota\.com|juno\.com|atmail\.com|fastmail\.com|gmxmail\.com|hushmail\.com|lycos\.com|mail\.com|yandex\.com|2mailcache\.com|3way3\.com|bk\.ru|1mailcache\.com|web\.de|bizopphand\.info|unlockrevenue\.info))([a-zA-Z0-9.-]+\.[a-zA-Z]{2,})$'
    '#pattern_error': 'Please enter your official email address. If you don''t have one, <a href="/contact-us">click here</a>'
  phone:
    '#type': tel
    '#title': 'Phone number'
    '#default_value': '+966 '
    '#international': true
    '#international_initial_country': SA
  company_name:
    '#type': textfield
    '#title': 'Company name'
    '#required': true
  support_needed:
    '#type': select
    '#title': 'What support do you need?'
    '#required': true
    '#empty_option': '- Select -'
    '#options':
      product_registration: 'Product registration or listing.'
      establishment: 'Establishment or warehouse licence.'
      authorized_representative: 'Authorized representative.'
      import_clearance: 'Import clearance coordination.'
      file_review: 'File review before submission.'
      not_sure: 'Not sure — help me choose.'
  requirements:
    '#type': textarea
    '#title': 'Tell us about your requirements'
    '#description': 'Mention the product type, the SFDA system already used if any, and whether goods have arrived. Please do not include passwords or account access credentials.'
    '#rows': 4
  captcha:
    '#type': captcha
    '#captcha_type': recaptcha/reCAPTCHA
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Submit
