services:
  logger.channel.email_verification:
    parent: logger.channel_base
    arguments: ['email_verification']
    tags:
      - { name: logger.channel, channel: email_verification }

  email_verification.branded_email:
    class: Drupal\email_verification\BrandedEmailBuilder
    arguments:
      - '@plugin.manager.mail'
      - '@logger.channel.email_verification'
      - '@config.factory'
      - '@renderer'
      - '@language_manager'
      - '@request_stack'

  email_verification.otp_manager:
    class: Drupal\email_verification\EmailVerificationOtpManager
    arguments:
      - '@tempstore.private'
      - '@email_verification.branded_email'
      - '@logger.channel.email_verification'
      - '@config.factory'
