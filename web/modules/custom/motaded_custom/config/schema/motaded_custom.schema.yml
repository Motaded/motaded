condition.plugin.motaded_404_page:
  type: condition.plugin
  label: 'Motaded 404 page visibility'

motaded_custom.tasheer_visa:
  type: config_object
  label: 'Tasheer visa conditions'
  mapping:
    webform_id:
      type: string
      label: 'Webform machine name'
    json_path:
      type: string
      label: 'JSON fallback path'
    options:
      type: mapping
      label: 'Webform options IDs'
      mapping:
        nationality:
          type: string
          label: 'Nationality options ID'
        visa_type:
          type: string
          label: 'Visa type options ID'
        number_of_entries:
          type: string
          label: 'Number of entries options ID'
        visa_validity:
          type: string
          label: 'Visa validity options ID'
    conditions:
      type: mapping
      label: 'Conditions maps'
      mapping:
        visa_type_by_nationality:
          type: ignore
          label: 'Visa type by nationality'
        entries_by_nat_visa_type:
          type: ignore
          label: 'Entries by nationality and visa type'
        validity_by_nat_visa_type_entry:
          type: ignore
          label: 'Validity by nationality, visa type and entries'
    messages:
      type: mapping
      label: 'Messages'
      mapping:
        no_options:
          type: string
          label: 'No options available message'

motaded_custom.market_indicators:
  type: config_object
  label: 'Market indicators (manual fallbacks)'
  mapping:
    manual_indicators:
      type: mapping
      label: 'Manual indicator rows'
      mapping:
        non_oil_gdp_growth:
          type: mapping
          label: 'Non-oil GDP Growth (manual)'
          mapping:
            enabled:
              type: boolean
              label: 'Enabled'
            label:
              type: label
              label: 'Table label'
            value_raw:
              type: ignore
              label: 'Numeric value (e.g. percent as 4.4)'
            value_display:
              type: label
              label: 'Display string (optional if value_raw set)'
            year:
              type: ignore
              label: 'Reference year'
            source_name:
              type: label
              label: 'Source name'
            source_url:
              type: uri
              label: 'Source URL'
