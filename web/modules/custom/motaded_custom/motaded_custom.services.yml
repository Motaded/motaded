services:
  Drupal\motaded_custom\Seo\MetatagTitleSuffixHelper:
    autowire: true
  Drupal\motaded_custom\Hook\MetatagSanitizeHooks:
    autowire: true
  Drupal\motaded_custom\Hook\MetatagTitleHooks:
    autowire: true
  Drupal\motaded_custom\Hook\PageTitleHooks:
    autowire: true
  Drupal\motaded_custom\Hook\WebformMetatagHooks:
    autowire: true
  Drupal\motaded_custom\Hook\ViewsMetatagHooks:
    autowire: true
  Drupal\motaded_custom\EventSubscriber\ContactUsNoindexSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\motaded_custom\EventSubscriber\DevSeoTrackingSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\motaded_custom\EventSubscriber\NodeToAliasRedirectSubscriber:
    arguments:
      - '@path_alias.manager'
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }
  Drupal\motaded_custom\EventSubscriber\ImageAltFallbackSubscriber:
    tags:
      - { name: event_subscriber }

  motaded_custom.world_bank_indicator_client:
    class: Drupal\motaded_custom\MarketIndicators\WorldBankIndicatorClient
    arguments: ['@http_client', '@logger.factory']

  motaded_custom.market_indicator_normalizer:
    class: Drupal\motaded_custom\MarketIndicators\MarketIndicatorNormalizer

  motaded_custom.market_indicator_repository:
    class: Drupal\motaded_custom\MarketIndicators\MarketIndicatorRepository
    arguments: ['@database', '@logger.factory']

  motaded_custom.market_indicators_importer:
    class: Drupal\motaded_custom\MarketIndicators\MarketIndicatorsImporter
    arguments:
      - '@motaded_custom.world_bank_indicator_client'
      - '@motaded_custom.market_indicator_normalizer'
      - '@motaded_custom.market_indicator_repository'
      - '@config.factory'
      - '@logger.factory'
      - '@datetime.time'
      - '@cache_tags.invalidator'

  motaded_custom.sector_indicator_repository:
    class: Drupal\motaded_custom\SectorIndicators\SectorIndicatorRepository
    arguments: ['@database', '@logger.factory']

  motaded_custom.gastat_statistics_client:
    class: Drupal\motaded_custom\SectorIndicators\GastatStatisticsClient
    arguments: ['@http_client', '@logger.factory']

  motaded_custom.sector_indicators_importer:
    class: Drupal\motaded_custom\SectorIndicators\SectorIndicatorsImporter
    arguments:
      - '@motaded_custom.world_bank_indicator_client'
      - '@motaded_custom.market_indicator_normalizer'
      - '@motaded_custom.sector_indicator_repository'
      - '@motaded_custom.gastat_statistics_client'
      - '@logger.factory'
      - '@datetime.time'
      - '@cache_tags.invalidator'

  motaded_custom.sector_page_key_stats_builder:
    class: Drupal\motaded_custom\SectorKeyStats\SectorPageKeyStatsBuilder
    arguments:
      - '@motaded_custom.world_bank_indicator_client'
      - '@motaded_custom.market_indicator_normalizer'
      - '@motaded_custom.sector_indicator_repository'
      - '@string_translation'

  motaded_custom.logistics_trade_volume_chart_builder:
    class: Drupal\motaded_custom\SectorKeyStats\TradeVolumeChartBuilder
    arguments:
      - '@entity_type.manager'
      - '@motaded_custom.world_bank_indicator_client'

  motaded_custom.sector_gastat_activity_chart_builder:
    class: Drupal\motaded_custom\SectorKeyStats\SectorGastatActivityGrowthChartBuilder
    arguments:
      - '@entity_type.manager'
      - '@motaded_custom.gastat_statistics_client'
