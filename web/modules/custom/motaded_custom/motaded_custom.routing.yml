motaded_custom.featuredcard_page:
  path: '/featured-card-page'
  defaults:
    _controller: '\Drupal\motaded_custom\Controller\FeaturedCardController::featuredCardPage'
    _title: 'Featured Card Page'
  requirements:
    _permission: 'access content'

motaded_custom.tasheer_visa_settings:
  path: '/admin/config/services/tasheer-visa-conditions'
  defaults:
    _form: '\Drupal\motaded_custom\Form\TasheerVisaSettingsForm'
    _title: 'Tasheer visa conditions'
  requirements:
    _permission: 'administer site configuration'

