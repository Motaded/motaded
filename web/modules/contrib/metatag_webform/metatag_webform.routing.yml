metatag_webform.settings_form:
  path: '/admin/structure/webform/manage/{webform}/metatags'
  defaults:
    _form: '\Drupal\metatag_webform\Form\MetatagWebformDefaultsForm'
    _title_callback: '\Drupal\webform\Controller\WebformEntityController::title'
  options:
    parameters:
      webform:
        type: 'entity:webform'
    _admin_route: TRUE
  requirements:
    _entity_access: 'webform.update'
