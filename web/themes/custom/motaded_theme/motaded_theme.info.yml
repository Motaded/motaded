name: Motaded theme
type: theme
description: 'Launch your business website fast with the Muin Drupal theme. Built by <a href="https://banafsijy.com" target="_blank">Banafsijy.com</a>.'
core_version_requirement: ^11
"base theme": false
version: 1.0.0
project_license: "Muin Theme © Banafsijy – Single Project License"
project_owner: "Banafsijy"
libraries:
  - motaded_theme/base
  - motaded_theme/messages
  # - core/normalize
  # Alpine: attach_library in includes/header.html.twig (required by header/menus).
libraries-extend:
  user/drupal.user:
    - motaded_theme/user
  core/drupal.dropbutton:
    - motaded_theme/dropbutton
  core/drupal.dialog:
    - motaded_theme/dialog
  file/drupal.file:
    - motaded_theme/file
  core/drupal.progress:
    - motaded_theme/progress
  core/drupal.tablesort:
    - motaded_theme/drupal.tablesort
  # Non-blocking FA: override strips sync CSS; this attaches footer JS loader.
  social_link_field/fontawesome.component:
    - motaded_theme/fontawesome_async
libraries-override:
  # Replace an asset with another.
  system/base:
    css:
      component:
        css/components/hidden.module.css: css/hidden.css
  # Remove render-blocking FA from head; motaded_theme/fontawesome_async loads after parse.
  social_link_field/fontawesome.component:
    css:
      component:
        '//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css': false
        '//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/v4-shims.min.css': false
generator: "starterkit_theme:11.2.5"

settings:
  linkedin_contact_lead_conversion_id: ''

regions:
  main_menu: "Main menu"
  menu_mobile: "Mobile menu"
  drawer_cta: "Drawer CTA (below menu)"
  header_cta: "Header CTA"
  secondary_menu: "Secondary menu"
  breadcrumb: Breadcrumbs
  content: "Main content"
  below_content: "Below content"
  sidebar_first: "Sidebar first"
  sidebar_second: "Sidebar second"
  article_toc_cta: "Article sidebar CTA (below ToC)"
  pre_footer: "Pre-Footer Section"
  footer: Footer
  footer_about: "Footer about text (first column)"
  footer_bar: Bottom bar
