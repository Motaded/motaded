name: Motaded theme
type: theme
description: ''
core_version_requirement: ^11
'base theme': false
version: 1.0.0
libraries:
  - motaded_theme/base
  - motaded_theme/messages
  # - core/normalize
  - motaded_theme/alpine
libraries-extend:
  user/drupal.user:
    - motaded_theme/user
  core/drupal.dropbutton:
    - motaded_theme/dropbutton
  core/drupal.dialog:
    - motaded_theme/dialog
  file/drupal.file:
    - motaded_theme/file
  core/drupal.progress:
    - motaded_theme/progress
  core/drupal.tablesort:
    - motaded_theme/drupal.tablesort
libraries-override:
  # Replace an asset with another.
  system/base:
    css:
      component:
        css/components/hidden.module.css: css/hidden.css
generator: 'starterkit_theme:11.2.5'

regions:
  main_menu: 'Main menu'
  menu_mobile: 'Mobile menu'
  secondary_menu: "Secondary menu"
  breadcrumb: Breadcrumbs
  content: 'Main content'
  below_content: 'Below content'
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  footer: Footer
  footer_bar: Bottom bar
