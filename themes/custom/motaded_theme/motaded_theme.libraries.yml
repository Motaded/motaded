alpine:
  remote: https://alpinejs.dev
  version: 3.15.0
  license:
    name: MIT
    url: https://github.com/alpinejs/alpine/blob/main/LICENSE.md
    gpl-compatible: true
  dependencies:
    - core/drupal
  js:
    # Registers Alpine.data() in alpine:init; must run before alpine.min.js.
    js/alpine-components.js: { weight: -50 }
    js/alpine.min.js: { defer: true, weight: 0 }
