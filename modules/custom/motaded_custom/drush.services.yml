services:
  motaded_custom.drush.metatag_title_commands:
    class: Drupal\motaded_custom\Drush\Commands\MetatagTitleCommands
    arguments:
      - '@entity_type.manager'
      - '@Drupal\motaded_custom\Seo\MetatagTitleSuffixHelper'
    tags:
      - { name: drush.command }
  motaded_custom.drush.fr_es_redirect_commands:
    class: Drupal\motaded_custom\Drush\Commands\FrEsRedirectCommands
    arguments:
      - '@entity_type.manager'
      - '@path_alias.manager'
      - '@database'
      - '@language_manager'
      - '@entity_field.manager'
      - '@entity_type.bundle.info'
    tags:
      - { name: drush.command }
  motaded_custom.drush.zh_hans_glued_url_commands:
    class: Drupal\motaded_custom\Drush\Commands\ZhHansGluedUrlCommands
    arguments:
      - '@database'
    tags:
      - { name: drush.command }
  motaded_custom.drush.csv_old_url_noindex_commands:
    class: Drupal\motaded_custom\Drush\Commands\CsvOldUrlNoindexCommands
    arguments:
      - '@entity_type.manager'
      - '@path_alias.repository'
      - '@module_handler'
      - '@entity_field.manager'
      - '@language_manager'
    tags:
      - { name: drush.command }
